server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  # Resolve the API container at request time (Docker's DNS), not once at start-up: nginx then starts even while
  # the API is still loading demo data or restarting, instead of exiting with "host not found in upstream".
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://backend:8000;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Live updates (Server-Sent Events): no buffering, long-lived connection.
  location = /api/stream {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
